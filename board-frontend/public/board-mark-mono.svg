<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- The same mark as board-mark.svg, as one single-ink path on a transparent ground:
     Safari's pinned tab takes rel="mask-icon", recolours the ink itself, and renders a
     full-colour SVG there as a black blob. The disc is dropped on purpose — filled, it
     would swallow the lanes; as a ring thin enough to fit, it would be a hairline that
     disappears at 16. Regenerate this alongside board-mark.svg, on the same 4-unit grid. -->
  <path d="M14 16H18A2 2 0 0 1 20 18V46A2 2 0 0 1 18 48H14A2 2 0 0 1 12 46V18A2 2 0 0 1 14 16Z M30 16H34A2 2 0 0 1 36 18V30A2 2 0 0 1 34 32H30A2 2 0 0 1 28 30V18A2 2 0 0 1 30 16Z M46 16H50A2 2 0 0 1 52 18V38A2 2 0 0 1 50 40H46A2 2 0 0 1 44 38V18A2 2 0 0 1 46 16Z" fill="#000000"/>
</svg>
